name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# GITHUB_TOKEN に GitHub Pages へのデプロイ権限を付与
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイの競合を防ぐ設定
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: GitHub Pagesの設定
        uses: actions/configure-pages@v5

      - name: アーティファクトのアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          # 静的ファイルが存在するルートディレクトリを指定
          path: '.'

      - name: GitHub Pagesへのデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
